# ─── Smart Job Filters ──────────────────────────────────────────────────────
filters:
  experience_levels:
    - "Fresher"
    - "Junior"
  technology_groups:
    - ["C++", "C", "Java"]
  max_days_old: 5
  min_confidence_score: 70

# ─── Scraper Settings ──────────────────────────────────────────────────────
scraper:
  jobs_to_fetch: 40                 # How many jobs to retrieve per company (latest)
  limit_per_request: 200            # Max 200 (Oracle HCM limit)
  max_pages_per_company: 2          # Safety cap (will fetch until jobs_to_fetch reached)
  request_timeout_seconds: 30
  delay_between_pages: 1
  delay_between_companies: 2
  enable_prefilter: true
  pre_filters:
    - field: location
      operator: contains_any
      values: ["India", "Remote", "Hybrid", "Onsite", "Bengaluru", "Hyderabad", "Chennai", "Mumbai", "Delhi NCR", "Pune", "Kolkata", "Ahmedabad", "Kochi", "Thiruvananthapuram", "Coimbatore", "Indore", "Jaipur", "Bhubaneswar", "Warangal", "Nagpur", "Udaipur"]
    - field: title
      operator: contains_any
      values: ["Software", "Java", "C++", "SDE", "SWE", "AMTS", "MTS" , "Developer" , "Full Stack"]
    - field: title
      operator: contains_none
      values:
        - "Senior"
        - "Sr"
        - "Lead"
        - "Manager"
        - "Principal"
